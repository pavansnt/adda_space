<!-- ========================================================================
     2.5. DAY OVERFLOW EVENTS POPUP MODAL (+N More)
     ======================================================================== -->
<div class="adda-modal-backdrop" id="day-events-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="day-events-modal-title" style="display: none;">
  <div class="adda-modal-container adda-day-events-modal-container">
    <!-- Modal Header -->
    <div class="adda-day-events-modal-header" style="padding: 1.5rem 1.5rem 0.5rem; display: flex; align-items: flex-start; justify-content: space-between; background: #FFFFFF;">
      <div>
        <h3 id="day-events-modal-title" style="margin: 0; font-family: var(--font-headings); font-size: 1.35rem; font-weight: 800; color: #0F3A47; line-height: 1.25; letter-spacing: -0.015em;">Events</h3>
        <div id="day-events-modal-count" style="margin-top: 0.25rem; font-size: 0.875rem; color: #64748B; font-weight: 500;"></div>
      </div>
      <button type="button" class="adda-modal-close-btn" id="day-events-modal-close-btn" aria-label="Close" style="width: 32px; height: 32px; border-radius: 50%; background: #F1F5F9; border: none; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: #475569; cursor: pointer; line-height: 1; padding: 0;">&times;</button>
    </div>

    <!-- Modal Body: Scrollable list of cards -->
    <div id="day-events-modal-list" class="adda-day-events-list" style="padding: 0.75rem 1.5rem 1.5rem; overflow-y: auto; max-height: 60vh; display: flex; flex-direction: column; gap: 0.75rem;"></div>
  </div>
</div>
