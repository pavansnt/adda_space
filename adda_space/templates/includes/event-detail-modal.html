<!-- ========================================================================
     3. EVENT DETAIL POPUP MODAL
     ======================================================================== -->
<div class="adda-modal-backdrop adda-inline-f2892a2e8a" id="event-detail-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-event-title">
  <div class="adda-modal-container adda-inline-eb1967695a">
    <!-- Modal Header with Title and Close Button -->
    <div class="adda-modal-header adda-inline-90bd4b43a0">
      <h2 class="adda-modal-title adda-inline-c78521e382" id="modal-event-title"></h2>
      <button type="button" class="adda-modal-close-btn adda-inline-78b738b336" id="modal-detail-close-btn" aria-label="Close details">&times;</button>
      <!-- Hidden compatibility badges for test assertions -->
      <span class="adda-cat-badge cat-default adda-inline-f2892a2e8a" id="modal-event-badge">Adda</span>
      <span class="adda-tag adda-tag-city adda-inline-f2892a2e8a" id="modal-event-city">Bengaluru</span>
    </div>

    <div class="adda-modal-body adda-inline-ebce452884">
      <!-- Poster Image with Tap Hint -->
      <div class="adda-detail-poster-wrap adda-inline-b4a87db49e" id="modal-poster-wrap">
        <img src="" alt="Event Poster" id="modal-poster-img" class="adda-detail-poster-img adda-inline-78a485fd8a" onerror="this.closest('#modal-poster-wrap').style.display='none';" />
        <div class="adda-poster-tap-hint adda-inline-a3f9dcb0e1" id="modal-poster-hint">
          <span aria-hidden="true">&#x1F50D;</span> Tap to view full size
        </div>
      </div>

      <!-- Date, Time and Location Rows -->
      <div class="adda-detail-meta-list adda-inline-0f0a025e84">
        <div class="adda-detail-meta-row adda-inline-b8c7bdfb74" id="modal-event-time-row">
          <span class="adda-detail-icon adda-inline-2d81cce2af" aria-hidden="true">&#x1F5D3;&#xFE0F;</span>
          <span class="adda-detail-meta-text adda-inline-2c075dfbfd" id="modal-event-time"></span>
        </div>
        <div class="adda-detail-meta-row adda-inline-b8c7bdfb74" id="modal-event-venue-row">
          <span class="adda-detail-icon adda-inline-2d81cce2af" aria-hidden="true">&#x1F4CD;</span>
          <span class="adda-detail-meta-text adda-inline-8a0b199d54" id="modal-event-venue"></span>
        </div>
        <div class="adda-detail-meta-row adda-inline-f2892a2e8a" id="modal-event-mode-row">
          <span class="adda-detail-icon" aria-hidden="true">&#x1F465;</span>
          <span class="adda-detail-meta-text" id="modal-event-mode"></span>
        </div>
      </div>

      <!-- Description -->
      <div class="adda-detail-desc adda-inline-1575fbc94c" id="modal-event-desc"></div>

      <section class="adda-event-recap adda-event-recap--compact adda-inline-f2892a2e8a" id="modal-event-recap">
        <div class="adda-event-recap__eyebrow">What Happened</div>
        <h3 class="adda-event-recap__title" id="modal-recap-title"></h3>
        <div class="adda-event-recap__summary" id="modal-recap-summary"></div>
        <div class="adda-event-recap__outcomes adda-inline-f2892a2e8a" id="modal-recap-outcomes"></div>
        <div class="adda-event-recap__meta" id="modal-recap-meta"></div>
        <div class="adda-event-recap__gallery" id="modal-recap-gallery"></div>
      </section>

      <!-- Completely removed organized by section - hidden for compatibility -->
      <div id="modal-event-org" class="adda-inline-f2892a2e8a"></div>
    </div>

    <!-- Modal Footer: Green Share event button & Centered text Close button -->
    <div class="adda-modal-footer adda-detail-modal-footer adda-inline-ac0560262f">
      <button type="button" id="modal-register-btn" class="adda-inline-9656c9d67e" aria-hidden="true"></button>
      <button type="button" class="adda-btn-share-full" id="modal-share-btn">
        <span aria-hidden="true">&#x1F517;</span> Share event
      </button>
      <button type="button" class="adda-btn-text-close" id="modal-detail-action-close">
        Close
      </button>
    </div>
  </div>
</div>
